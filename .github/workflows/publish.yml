name: Publish

# Every push to main (a costing publish from the editor, or a wording change)
# rebuilds the PDF from the page and deploys the site and the PDF TOGETHER, so
# the site can never show new figures beside an old PDF.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write     # archive versions/<version>.pdf
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: true   # the newest push contains every earlier change

jobs:
  publish:
    # Pinned, not ubuntu-latest: the PDF is rendered by this image's Chrome with the
    # Arial fonts installed below, and the build refuses to publish if the pages come
    # out differently. Moved from 24.04 to 26.04 on 2026-10-10 after a side-by-side
    # trial: both built the same pages, text and fonts as the archived PDFs, with no
    # pixel differences. Move up the same way next time: build on the new version on
    # a branch, compare with the archive, then change this line.
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF tools and fonts
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils ttf-mscorefonts-installer >/dev/null
          fc-cache -f >/dev/null
          fc-list | grep -qi "arial" || { echo "Arial missing — layout would not match"; exit 1; }

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html expo.html financial.html comparison.html founders-insert.html founders-detail.html CNAME robots.txt assets data versions _site/

      - name: Build PDF (fails the publish unless 9 pages + the 1-page expo sheet + the 2-page financial sheets + the 2-page comparison + the 2-page Founder's Circle Insert and Detail Sheet, versioned, clean)
        run: python3 tools/build-pdf.py --out _site

      - name: Archive this version's PDF
        run: |
          v=$(python3 -c "import json;print(json.load(open('data/costing.json'))['version'])")
          # Each PDF is archived once per version (a sheet added mid-version is archived on its first publish)
          added=""
          for pair in ":Ownership-Program-Options" "-expo:Expo-1-Pager" "-financial:Financial-Detail-Sheet" \
                      "-financial-g1:G1-Financial-Detail-Sheet" "-financial-g2:G2-Financial-Detail-Sheet" \
                      "-financial-g2plus:G2plus-Financial-Detail-Sheet"; do
            a="versions/$v${pair%%:*}.pdf"
            if [ ! -f "$a" ]; then
              cp "_site/bop-Aero-SF50-${pair#*:}.pdf" "$a"
              cp "$a" _site/versions/
              added="$added $a"
            fi
          done
          # The customer comparison also depends on the SR22T costing and data/comparison.json,
          # so it is archived under all three versions (from the build's data/build.json)
          cv=$(python3 -c "import json;b=json.load(open('_site/data/build.json'));print('%s-comparison-sf50-%s-sr22t-%s'%(b['comparison'],b['sf50'],b['sr22t']))")
          a="versions/$cv.pdf"
          if [ ! -f "$a" ]; then
            cp "_site/bop-Aero-Aircraft-Ownership-Comparison.pdf" "$a"
            cp "$a" _site/versions/
            added="$added $a"
          fi
          # The Founder's Circle Insert + Detail Sheet use BOTH costings: archived under both versions
          for pair in "founders-insert:Founders-Circle-Insert" "founders-detail:Founders-Circle-Detail-Sheet"; do
            a=$(python3 -c "import json,sys;b=json.load(open('_site/data/build.json'));print('versions/%s-%s-sr22t-%s.pdf'%(b['sf50'],sys.argv[1],b['sr22t']))" "${pair%%:*}")
            if [ ! -f "$a" ]; then
              cp "_site/bop-Aero-${pair#*:}.pdf" "$a"
              cp "$a" _site/versions/
              added="$added $a"
            fi
          done
          if [ -n "$added" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $added
            git commit -m "Archive $v PDF [skip ci]"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
