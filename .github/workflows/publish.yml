name: Publish

# TEMPORARY, this branch only: builds the PDFs on Ubuntu 24.04 and 26.04 and compares
# each with the archived copy. Deploys nothing, commits nothing, never runs on main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-os-trial
  cancel-in-progress: true

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF tools and fonts
        continue-on-error: true
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils ttf-mscorefonts-installer >/dev/null
          fc-cache -f >/dev/null
          fc-list | grep -qi "arial" || { echo "Arial missing — layout would not match"; exit 1; }

      - name: Assemble site
        continue-on-error: true
        run: |
          mkdir _site
          cp -r index.html expo.html CNAME robots.txt assets data versions _site/

      - name: Build PDF
        continue-on-error: true
        run: python3 tools/build-pdf.py --out _site 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0 || echo "::notice title=Build on ${{ matrix.os }}::BUILD FAILED%0A$(tail -c 1500 build.log | sed 's/%/%25/g' | tr '\n' '~' | sed 's/~/%0A/g')"

      - name: Compare with the archived PDFs
        if: always()
        run: python3 tools/os_trial_compare.py || true
