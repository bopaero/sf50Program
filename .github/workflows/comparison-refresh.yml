name: Comparison refresh

# The customer comparison (comparison.html) also shows the SR22T share, whose costing
# lives in bopaero/sr22tProgram. An SR22T costing publish does not push to this repo,
# so this checks every 15 minutes whether the live SR22T costing is newer than the one
# this site was last built from (data/build.json, written by the Publish build) and,
# if so, runs Publish. No token beyond this repo's own GITHUB_TOKEN is involved
# (Raymond prefers no new long-lived tokens; decided 2026-10-16).
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  actions: write      # start the Publish workflow
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild when the SR22T costing changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          t=$(date +%s)
          live=$(curl -fsS "https://sr22tprogram.bopaero.com/data/costing.json?t=$t" | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])")
          built=$(curl -fsS "https://sf50program.bopaero.com/data/build.json?t=$t" | python3 -c "import json,sys;print(json.load(sys.stdin).get('sr22t') or '')" || echo "")
          echo "SR22T live: $live   comparison built from: ${built:-unknown}"
          if [ -z "$live" ]; then echo "Could not read the live SR22T costing"; exit 1; fi
          if [ "$live" = "$built" ]; then echo "Up to date."; exit 0; fi
          busy=$(gh run list --workflow publish.yml --limit 5 --json status -q '[.[] | select(.status != "completed")] | length')
          if [ "$busy" != "0" ]; then echo "A Publish run is already in progress; it will pick up the new costing."; exit 0; fi
          gh workflow run publish.yml --ref main
          echo "Started Publish for SR22T $live."
