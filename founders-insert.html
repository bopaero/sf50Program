<!DOCTYPE html>
<!--
  bop Aero — Founder's Circle Insert (2 pages). Rebuilt 2026-10-16 from Raymond's Pages
  Insert (Rev_7, BopAeroMediaAssets/Founder's Circle Insert.pages) so it can't drift, and
  reworded to carry the Founder's Circle Summary's program details WITHOUT financial
  figures (Raymond 2026-10-16); the figures are on the Founder's Circle Detail Sheet
  (founders-detail.html). The position counts come from BOTH costings (SF50 here, SR22T
  from sr22tprogram.bopaero.com); benefits and repurchase wording from assets/founders.js.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Founder’s Circle — bop Aero</title>
<style>
:root { --orange:#FF6700; --card:#FF8F45; --ink:#1a1a1a; --muted:#6b6b70; --frame:#9a9a9f; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #e9e9ec; color: var(--ink); font-family: Verdana, Tahoma, Arial, sans-serif; }
.page { background:#fff; max-width: 8.5in; margin: 20px auto; padding: 0.42in 0.45in 0.3in; box-shadow:0 2px 14px rgba(0,0,0,.12); }
.frame { border: 1px solid var(--frame); padding: 6px; height: 100%; display:flex; flex-direction:column; }
.band { background: var(--orange); color:#fff; text-align:center; padding: 14px 16px 12px; }
.band img { display:block; width: 150px; height:auto; margin: 0 auto 2px; }
.band h1 { margin:0; font-size: 34px; letter-spacing: .26em; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,.3); }
.collage { display:grid; grid-template-columns: 1.75fr 1fr; grid-template-rows: 3.7in; gap: 4px; margin-top: 4px; overflow: hidden; }
.collage img { display:block; width:100%; height:100%; object-fit: cover; }
.collage .stack { display:grid; grid-template-rows: minmax(0,1fr) minmax(0,1fr); gap: 4px; min-height: 0; }
.collage .stack img { min-height: 0; }
.copy { padding: 16px 10px 0; font-size: 14.5px; line-height: 1.6; }
.copy p { margin: 0 0 13px; }
.banner { display:block; width:100%; height: 1.55in; object-fit: cover; object-position: 50% 40%; }
h2 { font-size: 16px; margin: 18px 10px 10px; }
.benefits { columns: 2; column-gap: 26px; font-size: 12.5px; line-height: 1.4; margin: 0 10px 0 36px; padding: 0; }
.benefits li { break-inside: avoid; margin: 0 0 5px; }
.fine { font-size: 8.5px; color: var(--muted); font-style: italic; margin: 2px 10px 0 36px; }
.exit { margin: 14px 10px 0; padding: 9px 12px; border-left: 3px solid var(--orange); background: #f6f6f8; font-size: 11.5px; line-height: 1.5; }
.exit b { display:block; font-size: 12.5px; margin-bottom: 2px; }
.lower { display:grid; grid-template-columns: 2.4in 1fr; gap: 20px; margin: 22px 10px 0; align-items: start; }
.card img { display:block; width:100%; aspect-ratio: 1 / 0.85; object-fit: cover; }
.card .who { background: var(--card); color:#fff; font-weight:bold; font-size: 12px; line-height: 1.45; padding: 10px 12px 12px; }
.card .who .name { font-size: 16px; }
.card .who p { margin: 0 0 9px; }
.card .who p:last-child { margin: 0; }
.why { font-size: 14px; line-height: 1.55; padding-top: 6px; }
.why p { margin: 0 0 8px; }
.why ul { margin: 0; padding-left: 20px; }
.why li { margin: 0 0 5px; }
.tag { margin-top: auto; text-align:center; font-weight:bold; font-size: 16px; letter-spacing: .32em; padding: 16px 0 6px; }
.small { font-size: 7.8px; color: var(--muted); font-style: italic; text-align:center; margin: 0 10px 2px; line-height: 1.35; }
.ver { text-align:right; font-size: 8.5px; color: var(--muted); padding: 0 2px; }
.err { color:#b91c1c; padding: 20px; }
@page { size: letter; margin: 0; }
@media print {
  body { background:#fff; }
  .page { width: 8.5in; height: 11in; max-width:none; margin:0; box-shadow:none; overflow:hidden; break-after: page; }
  .page:last-child { break-after: auto; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
@media (max-width: 640px) { .page { padding: 10px; } .band h1 { font-size: 24px; letter-spacing: .12em; } .collage { height: auto; grid-template-columns: 1fr; } .copy { font-size: 13px; } .benefits { columns: 1; } .lower { grid-template-columns: 1fr; } .tag { letter-spacing: .12em; } }
</style>
</head>
<body>
<main id="doc"><noscript><p class="err">This page needs JavaScript to display.</p></noscript></main>
<script src="assets/costing.js"></script>
<script src="https://sr22tprogram.bopaero.com/assets/costing.js"></script>
<script src="assets/founders.js"></script>
<script>
var SR22T_SITE = 'https://sr22tprogram.bopaero.com';
function esc(s) { return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function render(sf, sr) {
  var problems = SF50Costing.validate(sf).map(function (e) { return 'SF50: ' + e; })
    .concat(SR22TCosting.validate(sr).map(function (e) { return 'SR22T: ' + e; }));
  if (problems.length) throw new Error('Costing is not valid: ' + problems.join('; '));
  var FC = FoundersCircle;
  var list = FC.programs(SF50Costing.derive(sf), SR22TCosting.derive(sr));
  if (!list.length) throw new Error('No program offers the Founder’s Circle in either costing.');
  var stamp = 'SF50 ' + sf.version + ' · SR22T ' + sr.version;   // build-pdf.py checks this on every page

  var page1 =
    '<section class="page"><div class="frame">' +
      '<div class="band"><img src="assets/bop-aero-logo.svg" alt="bop Aero"><h1>Founder’s Circle</h1></div>' +
      '<div class="collage"><img src="assets/fc-vision-jet-keys.jpg" alt="Owner stepping out of a Cirrus Vision Jet" style="object-position: 50% 60%">' +
        '<div class="stack"><img src="assets/fc-vision-jet-cabin.jpg" alt="Owners working in the Vision Jet cabin">' +
        '<img src="assets/fc-sr22t-keys.jpg" alt="Owners in a Cirrus SR22T"></div></div>' +
      '<div class="copy">' +
        '<p>The Founder’s Circle is an exclusive ownership tier reserved for the most committed partners in the bop Aero platform.</p>' +
        '<p>It’s an optional add-on to a standard share, not a different class of equity. Every owner holds the same ownership interest in their aircraft.</p>' +
        '<p>Founder’s Circle Members receive a permanent layer of contractual privileges that enhance access, protect long-term economics, expand fleet flexibility, provide a defined path to exit, and give a formal voice in shaping the future of bop Aero.</p>' +
        '<p>Positions are strictly limited: ' + esc(FC.availability(list)) + '. Once those positions are filled, the Founder’s Circle for that aircraft is permanently closed.</p>' +
      '</div>' +
      '<div class="ver" style="margin-top:auto">' + esc(stamp) + '</div>' +
    '</div></section>';

  var page2 =
    '<section class="page"><div class="frame">' +
      '<img class="banner" src="assets/fc-jet-banner.png" alt="Cirrus Vision Jet in flight">' +
      '<h2>Founder’s Circle Core Benefits:</h2>' +
      '<ul class="benefits">' + FC.BENEFITS.map(function (b) { return '<li>' + esc(b.name) + '</li>'; }).join('') + '</ul>' +
      '<p class="fine">*' + esc(FC.DURATION_NOTE) + '</p>' +
      '<div class="exit"><b>Structured Exit Support</b>' + esc(FC.liquidityText()) + '</div>' +
      '<div class="lower">' +
        '<div class="card"><img src="assets/raymond-chase.jpg" alt="Raymond Chase">' +
          '<div class="who"><p><span class="name">Raymond Chase</span><br>President &amp; CEO<br>859.419.8645<br>raymond@bopaero.com</p>' +
          '<p>Cincinnati West Airport<br>Hangar 27<br>10030 West Rd<br>Harrison, OH 45030</p></div></div>' +
        '<div class="why"><p>The Founder’s Circle is designed for owners who want more than just access to a great airplane. It’s for those who want to:</p>' +
          '<ul><li>Protect long-term economics</li><li>Create true platform insiders</li><li>Build a loyal ownership community</li><li>Align incentives between owners and management</li></ul></div>' +
      '</div>' +
      '<div class="tag">Limited by design. Defined by access.</div>' +
      '<p class="small">' + esc(FC.AGREEMENT_NOTE) + ' Pricing is on the Founder’s Circle Detail Sheet.</p>' +
      '<div class="ver">' + esc(stamp) + '</div>' +
    '</div></section>';

  document.getElementById('doc').innerHTML = page1 + page2;
  document.documentElement.setAttribute('data-versions', JSON.stringify({ sf50: sf.version, sr22t: sr.version }));
  document.documentElement.setAttribute('data-rendered', sf.version);   // build-pdf.py waits for this
}
function getJson(u) { return fetch(u, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(u + ' HTTP ' + r.status); return r.json(); }); }
Promise.all([getJson('data/costing.json'), getJson(SR22T_SITE + '/data/costing.json?t=' + Date.now())])
  .then(function (x) {
    if (!window.SR22TCosting) throw new Error('the SR22T costing library did not load');
    render(x[0], x[1]);
  })
  .catch(function(err){
    document.getElementById('doc').innerHTML = '<p class="err">This page could not be displayed. ' + esc(err.message || err) + '</p>';
    document.documentElement.setAttribute('data-render-error', String(err.message || err));
  });
</script>
</body>
</html>
