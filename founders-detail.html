<!DOCTYPE html>
<!--
  bop Aero — Founder's Circle Program Economics (Founder's Circle Detail Sheet, 2 pages).
  Added 2026-10-16 (Raymond): the figures behind the Founder's Circle Insert, styled
  identically to the Financial Detail Sheets (financial.html). Every figure comes from
  BOTH costings through their costing.js: the SF50 costing here, the SR22T costing from
  sr22tprogram.bopaero.com, so an SR22T publish rebuilds it through
  .github/workflows/comparison-refresh.yml. Benefits and repurchase terms come from
  assets/founders.js (shared with the Insert and the internal Summary). Customer-facing:
  the internal liquidity-reserve allocation and company economics stay in the Summary.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>2026 Founder’s Circle Program Economics — bop Aero</title>
<style>
:root { --orange:#FF6700; --ink:#1a1a1a; --muted:#6b6b70; --rule:#d9d9de; --stripe:#efeff2; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #e9e9ec; color: var(--ink); font-family: Verdana, Tahoma, Arial, sans-serif; }
.page { background:#fff; max-width: 8.5in; margin: 20px auto; padding: 0.42in 0.45in 0.3in; display:flex; flex-direction:column; box-shadow:0 2px 14px rgba(0,0,0,.12); }
.band { background: var(--orange); color:#fff; text-align:center; padding: 12px 16px 14px; }
.band img { display:block; width: 140px; height:auto; margin: 0 auto 6px; }
.band h1 { margin:0; font-size: 22px; letter-spacing: .16em; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,.25); }
.hero { display:grid; grid-template-columns: 1.15fr 1fr; grid-template-rows: 3.2in; gap: 4px; overflow: hidden; }
.hero img { display:block; width:100%; height:100%; object-fit: cover; }
h2 { text-align:center; font-size: 15px; font-weight: bold; margin: 26px 0 10px; }
.row { display:flex; justify-content:space-between; align-items:baseline; padding: 6px 6px; font-size: 12px; border-top: 1px solid var(--rule); }
.row.alt { background: var(--stripe); }
.row b { font-size: 14px; }
/* One value column per aircraft (the Financial sheets have one program, so one value) */
.row > span:first-child { flex: 1; }
.row .v { width: 1.55in; text-align: right; }
.row.head { border-top: 0; padding-bottom: 2px; }
.row.head .v { font-size: 11px; font-weight: bold; }
.center { text-align:center; font-size: 11px; margin: 4px 0 10px; }
.detail { margin: 6px 0 0 52px; border-left: 1px solid #222; }
.detail h4 { text-align:center; font-size: 12.5px; margin: 10px 0 6px; }
.detail .sub { padding-left: 120px; font-style: italic; color: #333; }
.detail .sub b { font-weight: normal; font-style: italic; font-size: 12.5px; }
.desc { font-style: italic; color: #555; font-size: 10.5px; padding: 4px 6px 6px; background: var(--stripe); }
.terms .row { font-size: 10.5px; align-items: flex-start; padding: 5px 6px; }
.tenure .row { padding: 3px 6px; font-size: 11px; }
.tenure .row b { font-size: 12px; }
.terms .row > span:first-child { flex: 0 0 1.9in; font-weight: bold; }
.terms .row > span:last-child { flex: 1; }
.benefits { columns: 2; column-gap: 22px; font-size: 11.5px; line-height: 1.35; margin: 0 6px 10px 24px; padding: 0; }
.page2 .stars { margin-top: 10px; }
.page2 .center { margin-bottom: 6px; }
.page2 .detail h4 { margin: 8px 0 4px; }
.page2 h2 { margin: 16px 0 8px; }
.benefits li { break-inside: avoid; margin: 0 0 6px; }
.stars { text-align:center; letter-spacing: .4em; margin: 22px 0 2px; font-weight: bold; }
.contact { display:grid; grid-template-columns: 2.3in 1fr; gap: 14px; margin-top: auto; align-items: end; }
.contact + .foot { margin-top: 0; padding-top: 22px; }   /* the card sits on the footer, as on the Financial sheets */
.card img { display:block; width:100%; aspect-ratio: 1 / 1; object-fit: cover; }
.card .who { background: var(--orange); color:#fff; font-weight:bold; font-size: 12px; line-height: 1.45; padding: 12px 14px 14px; }
.card .who .name { font-size: 16px; }
.card .who p { margin: 0 0 10px; }
.card .who p:last-child { margin: 0; }
.notes { font-size: 8.3px; color: var(--muted); font-style: italic; line-height: 1.35; }
.notes p { margin: 0 0 3px; }
sup { font-size: 65%; }
.foot { margin-top:auto; padding-top: 12px; display:grid; grid-template-columns: 1fr 1fr 1fr; font-weight:bold; letter-spacing:.38em; font-size: 10.5px; text-align:center; position:relative; }
.foot .ver { position:absolute; right:0; bottom:-13px; letter-spacing:0; font-weight:normal; font-size: 8.5px; color: var(--muted); }
.err { color:#b91c1c; padding: 20px; }
@page { size: letter; margin: 0; }
@media print {
  body { background:#fff; }
  .page { width: 8.5in; height: 11in; max-width:none; margin:0; box-shadow:none; overflow:hidden; break-after: page; }
  .page:last-child { break-after: auto; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
@media (max-width: 640px) { .page { padding: 16px; } .detail { margin-left: 12px; } .detail .sub { padding-left: 16px; } .row .v { width: auto; padding-left: 10px; } .terms .row { display:block; } .benefits { columns: 1; } .contact { grid-template-columns: 1fr; } .foot { grid-template-columns: 1fr; letter-spacing:.2em; gap:4px; } .foot .ver { position: static; } }
</style>
</head>
<body>
<main id="doc"><noscript><p class="err">This page needs JavaScript to display.</p></noscript></main>
<script src="assets/costing.js"></script>
<script src="https://sr22tprogram.bopaero.com/assets/costing.js"></script>
<script src="assets/founders.js"></script>
<script>
var SR22T_SITE = 'https://sr22tprogram.bopaero.com';
function money(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
function pct(x) { return String(+(x * 100).toFixed(2)) + '%'; }
function esc(s) { return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function foot(stamp) {
  return '<footer class="foot"><span>bopaero.com</span><span>(513) 450-2FLY</span><span>info@bopaero.com</span><span class="ver">' + esc(stamp) + '</span></footer>';
}

function render(sf, sr) {
  var problems = SF50Costing.validate(sf).map(function (e) { return 'SF50: ' + e; })
    .concat(SR22TCosting.validate(sr).map(function (e) { return 'SR22T: ' + e; }));
  if (problems.length) throw new Error('Costing is not valid: ' + problems.join('; '));
  var FC = FoundersCircle, R = FC.REPURCHASE;
  var list = FC.programs(SF50Costing.derive(sf), SR22TCosting.derive(sr));
  if (!list.length) throw new Error('No program offers the Founder’s Circle in either costing.');
  // A rate shared by every program reads in the label; otherwise beside each figure
  function rate(field) {
    var v = list.map(function (x) { return x.rates[field]; });
    return v.every(function (y) { return y === v[0]; }) ? ' (' + pct(v[0]) + ')' : '';
  }
  function cells(fn, field) {
    var shared = !field || rate(field);
    return list.map(function (x) { return '<b class="v">' + fn(x) + (shared ? '' : ' <small>(' + pct(x.rates[field]) + ')</small>') + '</b>'; }).join('');
  }
  function row(label, values, cls) { return '<div class="row' + (cls ? ' ' + cls : '') + '"><span>' + label + '</span>' + values + '</div>'; }
  var head = row('', list.map(function (x) { return '<span class="v">' + esc(x.label) + '</span>'; }).join(''), 'head');
  var stamp = 'SF50 ' + sf.version + ' · SR22T ' + sr.version;   // build-pdf.py checks this on every page

  var page1 =
    '<section class="page">' +
      '<div class="band"><img src="assets/bop-aero-logo.svg" alt="bop Aero"><h1>2026 Founder’s Circle Program Economics</h1></div>' +
      '<div class="hero"><img src="assets/fc-vision-jet-keys.jpg" alt="Owner stepping out of a Cirrus Vision Jet" style="object-position: 50% 62%">' +
        '<img src="assets/fc-sr22t-keys.jpg" alt="Owners in a Cirrus SR22T"></div>' +
      '<h2>Founder’s Circle Owner Pricing (per Share)</h2>' +
      head +
      row('Owner Equity Investment (per share)<sup>1</sup>', cells(function (x) { return money(x.p.capPerShare); })) +
      row('One-time Founder Activation Fee' + rate('activationRate') + '<sup>2</sup>', cells(function (x) { return money(x.p.founderActivation); }, 'activationRate'), 'alt') +
      '<div class="detail">' +
        '<h4>Annual Founder Program Fee (per Share)</h4>' +
        head +
        row('Projected Annual Program Fee', cells(function (x) { return '~' + money(x.p.annualFee); }), 'sub alt') +
        row('Annual Founder Premium' + rate('premiumRate'), cells(function (x) { return money(x.p.founderPremium); }, 'premiumRate'), 'sub') +
        row('Total Annual Founder Program Fee*', cells(function (x) { return '~' + money(x.p.founderAnnualFee); })) +
        '<div class="desc">The Founder’s Circle premium is billed annually with the Annual Program Fee.</div>' +
      '</div>' +
      '<div class="stars">* * *</div>' +
      '<h2>Founder’s Circle Availability</h2>' +
      head +
      row('Founder’s Circle positions per aircraft<sup>3</sup>', cells(function (x) { return x.positions + ' of ' + x.shares + ' shares'; }), 'alt') +
      '<p class="center">Once those positions are filled, the Founder’s Circle for that aircraft is permanently closed.</p>' +
      foot(stamp) +
    '</section>';

  var tenure = R.tenure.map(function (t, i) {
    return row(esc(t.period), '<b class="v">' + pct(t.minCash) + '</b>', 'sub' + (i % 2 ? '' : ' alt'));
  }).join('');
  var page2 =
    '<section class="page page2">' +
      '<h2 style="margin-top:0">Founder Repurchase Program<sup>4</sup></h2>' +
      '<p class="center">Structured Exit Support: a defined path to exit your ownership interest.</p>' +
      '<div class="terms">' +
        row('Minimum ownership period', '<span>' + R.minMonths + ' months before a Founder may request a repurchase.</span>') +
        row('Notice', '<span>' + R.noticeDays + ' days’ written notice.</span>', 'alt') +
        row('During notice', '<span>' + esc(R.duringNotice) + '</span>') +
        row('At closing', '<span>' + esc(R.atClosing) + '</span>', 'alt') +
        row('Payment', '<span>' + esc(R.payment) + '</span>') +
      '</div>' +
      '<div class="detail tenure">' +
        '<h4>Minimum Cash Payment by Tenure</h4>' +
        row('Time in Founder’s Circle at repurchase closing', '<b class="v">Minimum cash</b>', 'head') +
        tenure +
      '</div>' +
      '<div class="stars">* * *</div>' +
      '<h2>Founder’s Circle Core Benefits</h2>' +
      '<ul class="benefits">' + FC.BENEFITS.map(function (b) { return '<li>' + esc(b.name) + '</li>'; }).join('') + '</ul>' +
      '<div class="contact">' +
        '<div class="card"><img src="assets/raymond-chase.jpg" alt="Raymond Chase">' +
          '<div class="who"><p><span class="name">Raymond Chase</span><br>President &amp; CEO<br>859.419.8645<br>raymond@bopaero.com</p>' +
          '<p>Cincinnati West Airport<br>Hangar 27<br>10030 West Rd<br>Harrison, OH 45030</p></div></div>' +
        '<div class="notes">' +
          '<p>* ' + esc(FC.FIXED_FEE) + ' The Annual Program Fee for other owners is subject to change annually due to material and supply chain constraints.</p>' +
          '<p><sup>1</sup> A Founder buys the same aircraft share as any other owner, then elects the Founder’s Circle add-on. It is not a different class of equity. See each program’s Financial Detail Sheet for the share breakdown.</p>' +
          '<p><sup>2</sup> Paid once, when the Founder’s Circle add-on is elected.</p>' +
          '<p><sup>3</sup> Founder’s Circle is offered on new program aircraft only; pre-owned SF50 programs (G1, G2, G2+) do not include it.</p>' +
          '<p><sup>4</sup> ' + esc(FC.AGREEMENT_NOTE) + '</p>' +
        '</div>' +
      '</div>' +
      foot(stamp) +
    '</section>';

  document.getElementById('doc').innerHTML = page1 + page2;
  document.documentElement.setAttribute('data-versions', JSON.stringify({ sf50: sf.version, sr22t: sr.version }));
  document.documentElement.setAttribute('data-rendered', sf.version);   // build-pdf.py waits for this
}
function getJson(u) { return fetch(u, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(u + ' HTTP ' + r.status); return r.json(); }); }
Promise.all([getJson('data/costing.json'), getJson(SR22T_SITE + '/data/costing.json?t=' + Date.now())])
  .then(function (x) {
    if (!window.SR22TCosting) throw new Error('the SR22T costing library did not load');
    render(x[0], x[1]);
  })
  .catch(function(err){
    document.getElementById('doc').innerHTML = '<p class="err">This page could not be displayed. ' + esc(err.message || err) + '</p>';
    document.documentElement.setAttribute('data-render-error', String(err.message || err));
  });
</script>
</body>
</html>
