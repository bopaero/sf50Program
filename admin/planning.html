<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Aircraft Cost Comparison — Planning Guide — bop Aero (internal)</title>
<!--
  Internal planning guide (Raymond 2026-10-16: never public). Replaces the hand-kept
  "6-Seat Aircraft Financial Comparison" (Oct 2026). Built in the browser on every
  open from BOTH published costings and data/comparison.json (latest on main), so
  it is always current; candidate/competitor figures are edited at /comparison.
  "Download PDF" prints the page (Letter).
-->
<style>
:root { --orange:#FF6700; --navy:#003666; --ink:#1a1a1a; --muted:#6b6b70; --rule:#d9d9de; --stripe:#efeff2; --bop:#fff1e8; --warn:#b45309; --warn-bg:#fff4e5; color-scheme: light; }
* { box-sizing: border-box; }
body { margin:0; background:#e9e9ec; color:var(--ink); font-family: Verdana, Tahoma, Arial, sans-serif; }
.bar { position:sticky; top:0; background:#111; color:#bbb; font: 12px -apple-system, Arial, sans-serif; padding:8px 14px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; z-index:2; }
.bar a { color:#ffb37f; } .bar button { margin-left:auto; font:inherit; font-weight:700; background:var(--orange); color:#fff; border:0; border-radius:4px; padding:6px 12px; cursor:pointer; }
.page { background:#fff; max-width: 8.5in; margin: 20px auto; padding: 0.4in 0.45in 0.35in; box-shadow:0 2px 14px rgba(0,0,0,.12); }
.band { background: var(--navy); color:#fff; padding: 12px 16px; }
.band h1 { margin:0; font-size: 18px; letter-spacing:.04em; }
.band .sub { font-size: 11px; opacity:.85; margin-top: 3px; }
.internal { display:inline-block; background: var(--orange); color:#fff; font-size: 9px; font-weight: bold; letter-spacing:.1em; padding: 2px 6px; margin-left: 8px; vertical-align: middle; }
h2 { font-size: 13px; color: var(--navy); margin: 18px 0 4px; break-after: avoid; }
p.lead { font-size: 10.5px; margin: 8px 0; line-height: 1.45; }
table { width:100%; border-collapse: collapse; font-size: 9.6px; margin-top: 5px; break-inside: avoid; }
th { text-align:left; font-size: 8.4px; text-transform: uppercase; letter-spacing:.03em; color:#fff; background: var(--navy); padding: 5px; }
th.n, td.n { text-align:right; white-space:nowrap; }
td { padding: 4px 5px; border-top: 1px solid var(--rule); vertical-align: top; }
tr:nth-child(even) td { background: var(--stripe); }
tr.bop td { background: var(--bop); font-weight: bold; }
tr.out td { color: var(--muted); }
td .s { display:block; font-size: 8.2px; color: var(--muted); font-weight: normal; }
.note { font-size: 8.6px; color: var(--muted); font-style: italic; margin: 5px 0 0; line-height: 1.4; }
.warn { background: var(--warn-bg); color: var(--warn); border-left: 3px solid var(--warn); padding: 6px 9px; font-size: 10px; margin-top: 8px; }
ul.notes { font-size: 9.6px; line-height: 1.45; padding-left: 16px; margin: 4px 0; }
.ver { font-size: 8px; color: var(--muted); text-align: right; margin-top: 14px; }
.err { color:#b91c1c; padding: 20px; }
@page { size: letter; margin: 0.35in 0; }
@media print { body { background:#fff; } .bar { display:none; } .page { box-shadow:none; margin:0 auto; padding-top: 0; } * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style>
</head>
<body>
<div class="bar">Internal · signed in as {{USER}} · <a href="/comparison/">Edit comparison data</a> · <a href="/">SF50 costing</a> · <a href="/sr22t/">SR22T costing</a> · <a href="https://sf50program.bopaero.com/comparison.html" target="_blank" rel="noopener">Customer sheet</a><button onclick="window.print()">Download PDF</button></div>
<main id="doc"><p class="err" style="color:#555">Loading…</p></main>
<script src="https://sf50program.bopaero.com/assets/costing.js"></script>
<script src="https://sr22tprogram.bopaero.com/assets/costing.js"></script>
<script src="https://sf50program.bopaero.com/assets/comparison.js"></script>
<script>
(function () {
  'use strict';
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function money(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
  function k(n) { return n >= 1e6 ? '$' + (n / 1e6).toFixed(2).replace(/0$/, '') + 'M' : '$' + (Math.round(n / 100) / 10).toString() + 'K'; }
  function yes(b) { return b ? 'Yes' : 'No'; }
  function getJson(u) { return fetch(u, { cache: 'no-store' }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); }); }

  function render(sf, sr, cmpSrc) {
    var C = window.AircraftComparison;
    var problems = C.validate(cmpSrc);
    if (problems.length) throw new Error('Comparison data is not valid: ' + problems.join('; '));
    var c = C.derive(cmpSrc, { SF50: SF50Costing.derive(sf), SR22T: SR22TCosting.derive(sr) }), pl = c.planning;
    if (!pl) throw new Error('The comparison data has no planning section.');
    var rule = pl.rule, srB = pl.bop[0], sfB = pl.bop[1];
    var srP = SR22TCosting.derive(sr).byKey[srB.share.program], sfP = SF50Costing.derive(sf).byKey[sfB.share.program];

    // 1. Candidate comparison (bop Aero programs from the costings + candidates from data)
    function bopRow(b, p, seats, cruise, fuel) {
      return '<tr class="bop"><td>' + esc(b.name) + '<span class="s">from the published costing ' + esc(b.share.version) + '</span></td><td class="n">' + seats + '</td><td class="n">' + k(b.price) + '</td>' +
        '<td>' + cruise + '</td><td>' + fuel + '</td><td>Yes</td><td>Yes</td><td>' + (p.features && p.features.connectivity ? esc(p.features.connectivity.text) : 'Yes') + '</td>' +
        '<td class="n">' + money(b.workingFee) + ' × ' + b.workingShares + '</td></tr>';
    }
    var cand = pl.candidates.map(function (x) {
      return '<tr' + (x.eliminated ? ' class="out"' : '') + '><td>' + esc(x.name) + (x.priceNote ? '<span class="s">' + esc(x.priceNote) + '</span>' : '') + '</td><td class="n">' + x.seats + '</td><td class="n">~' + k(x.price) + '</td>' +
        '<td>' + esc(x.cruise) + '</td><td>' + esc(x.fuel) + '</td><td>' + yes(x.ac) + '</td><td>' + yes(x.fiki) + '</td><td>' + yes(x.internet) + '</td>' +
        '<td class="n">' + (x.eliminated ? 'Eliminated' : '~' + money(x.workingFee) + ' × ' + x.workingShares) + '</td></tr>';
    }).join('');
    var elim = pl.candidates.filter(function (x) { return x.eliminated; }).map(function (x) { return esc(x.name) + ': ' + esc(x.eliminated); });
    var cnotes = pl.candidates.filter(function (x) { return x.note && !x.eliminated; }).map(function (x) { return '<li><b>' + esc(x.name) + ':</b> ' + esc(x.note) + '</li>'; }).join('');

    // 2. Management schedule + check against the costings
    var sched = pl.schedule.map(function (s, i, all) {
      var last = i === all.length - 1;
      return '<tr><td>' + s.partners + (last ? '+' : '') + '</td><td class="n">' + money(s.fee) + (s.capped ? ' cap' : '') + '</td><td class="n">' + money(s.perPartner) + (last ? ' at ' + s.partners : '') + '</td></tr>';
    }).join('');
    var mismatches = pl.checks.filter(function (x) { return !x.matches; });

    // 3. Custom partnerships
    var custom = pl.custom.map(function (x) {
      var b = /^bop-/.test(x.key);
      return '<tr' + (b ? ' class="bop"' : '') + '><td>' + esc(x.name) + '</td><td class="n">~' + k(x.costsBeforeMgmt) + '</td>' +
        x.partnerships.map(function (q, i) { return '<td class="n">' + k(q.each) + (i === 0 ? ' ea.' : '') + '</td>'; }).join('') + '</tr>';
    }).join('');

    // 4. Pre-owned screening (all aircraft, including those kept off the customer sheet)
    var screen = C.CLASSES.map(function (key) {
      var cl = c.classes[key];
      return cl.rows.concat(cl.excluded).map(function (r) {
        return '<tr' + (r.qualifies ? '' : ' class="out"') + '><td>' + esc(r.name) + '<span class="s">' + esc(r.vintage) + ' · ' + key + ' · ' + r.hours + ' h/yr</span></td>' +
          '<td class="n">' + k(r.price) + '</td><td class="n">' + money(r.annual) + '</td><td class="n">' + money(r.perHour) + '</td>' +
          '<td class="n">' + (r.tripPayload === null ? 'cannot fly trip' : Math.round(r.tripPayload) + ' lb') + '</td>' +
          '<td>' + (r.qualifies ? 'On the customer sheet' : esc(r.reasons.join('; '))) + '</td></tr>';
      }).join('');
    }).join('');

    var html =
      '<section class="page">' +
        '<div class="band"><h1>Aircraft Cost Comparison <span class="internal">INTERNAL</span></h1><div class="sub">Shared Ownership &amp; Custom Partnership Planning Guide</div></div>' +
        '<p class="lead"><b>Management Fee Guidance:</b> ' + money(rule.base) + ' base + ' + money(rule.perPartner) + ' per ownership partner, capped at ' + money(rule.cap) + ' per aircraft annually. Fuel, pilot expense and owner-specific taxes are excluded from annual program fees unless noted.</p>' +
        '<h2>Aircraft cost comparison</h2>' +
        '<table><tr><th>Aircraft</th><th class="n">Seats</th><th class="n">Approx. acquisition</th><th>Cruise</th><th>Typical fuel</th><th>A/C</th><th>FIKI</th><th>Internet</th><th class="n">Working annual fee</th></tr>' +
          bopRow(srB, srP, 5, '~200–210 KTAS', '~17–21 GPH 100LL') + cand + bopRow(sfB, sfP, 7, '~300 KTAS', '~55–60 GPH Jet-A') + '</table>' +
        (elim.length ? '<p class="note">' + elim.join(' ') + '</p>' : '') +
        '<h2>Working cost guidance</h2><ul class="notes">' +
          '<li><b>SR22T:</b> ' + money(srB.workingFee) + ' Annual Program Fee across ' + srB.workingShares + ' owners (costing ' + esc(srB.share.version) + ').</li>' +
          '<li><b>SF50 ' + esc(sfB.share.program) + ':</b> ' + money(sfB.workingFee) + ' Annual Program Fee across ' + sfB.workingShares + ' shares (costing ' + esc(sfB.share.version) + '). Custom 2–5 partner structures use the management-fee schedule below.</li>' +
          cnotes + '</ul>' +
        '<h2>bop Aero management fee schedule</h2>' +
        '<table style="width:60%"><tr><th>Partners / shares</th><th class="n">Annual management fee</th><th class="n">Management fee / partner</th></tr>' + sched + '</table>' +
        (mismatches.length ? '<div class="warn">The costing does not follow this schedule for: ' + mismatches.map(function (x) { return esc(x.aircraft + ' ' + x.program) + ' (' + x.shares + ' shares: ' + money(x.management) + ', schedule ' + money(x.expected) + ')'; }).join('; ') + '.</div>'
                           : '<p class="note">Every program in both costings follows this schedule (checked live).</p>') +
        '<h2>Custom / one-off partnership economics</h2>' +
        '<table><tr><th>Aircraft</th><th class="n">Aircraft costs before mgmt.</th>' + pl.partnerCounts.map(function (n) { return '<th class="n">' + n + ' partners</th>'; }).join('') + '</tr>' + custom + '</table>' +
        '<ul class="notes">' + pl.notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>' +
        '<h2>Pre-owned screening (customer comparison)</h2>' +
        '<p class="lead" style="margin-top:2px">Solo owner of a pre-owned aircraft vs one share, at the share’s hours; ' + Math.round(c.assumptions.depreciationRate * 100) + '% depreciation; FIKI + A/C + trip payload ≥ ' +
          Math.round(c.classes.piston.benchmarkPayload) + ' lb (SR22T, ' + c.classes.piston.tripNm + ' nm) / ' + Math.round(c.classes.turbine.benchmarkPayload) + ' lb (SF50 G3, ' + c.classes.turbine.tripNm + ' nm).</p>' +
        '<table><tr><th>Aircraft</th><th class="n">Price</th><th class="n">Est. annual</th><th class="n">Per hour</th><th class="n">Trip payload</th><th>Status</th></tr>' + screen + '</table>' +
        '<div class="ver">Comparison ' + esc(c.version) + ' · SF50 costing ' + esc(sf.version) + ' · SR22T costing ' + esc(sr.version) + ' · generated ' + new Date().toLocaleString('en-US') + '</div>' +
      '</section>';
    document.getElementById('doc').innerHTML = html;
  }
  Promise.all([getJson('/api/costing'), getJson('/sr22t/api/costing'), getJson('/comparison/api/data')])
    .then(function (x) { render(x[0].costing, x[1].costing, x[2].comparison); })
    .catch(function (e) { document.getElementById('doc').innerHTML = '<p class="err">Could not build the planning guide: ' + esc(e.message || e) + '</p>'; });
})();
</script>
</body>
</html>
